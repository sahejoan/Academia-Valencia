<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Background: Official Academia Valencia Vibrant Orange -->
  <rect width="256" height="256" rx="48" fill="#FF6600"/>

  <!-- Owl Mascot with Graduation Cap (White Vector Outline) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(28, 20)">
    <!-- Graduation Cap Mortarboard (Diamond Top) -->
    <polygon points="40,55 100,28 160,55 100,82" fill="#FF6600" />
    
    <!-- Graduation Cap Skullcap Band -->
    <path d="M 60 66 L 60 85 C 60 96, 140 96, 140 85 L 140 66" fill="#FF6600" />
    
    <!-- Tassel on the right side of the cap -->
    <path d="M 150 62 L 150 110" />
    <circle cx="150" cy="115" r="3.5" fill="#FFFFFF" />

    <!-- Owl Face / Body Outer Contour (Shield shape tapering to a bottom V point) -->
    <path d="M 52 95 L 46 125 C 44 140, 48 155, 58 166 L 100 212 L 142 166 C 152 155, 156 140, 154 125 L 148 95" />

    <!-- Owl Eyes (Large dual circles) -->
    <circle cx="76" cy="124" r="17" />
    <circle cx="124" cy="124" r="17" />

    <!-- Small Triangle Beak -->
    <polygon points="95,133 105,133 100,142" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Owl Pupils (Solid White dots) -->
  <g transform="translate(28, 20)">
    <circle cx="76" cy="124" r="6.5" fill="#FFFFFF" />
    <circle cx="124" cy="124" r="6.5" fill="#FFFFFF" />
  </g>
</svg>
